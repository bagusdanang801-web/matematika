<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>📚 Math Hub Premium - Rumus SD sampai S3</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(145deg, #e8f0fe, #d4e0f0, #c5d5e8);
      min-height: 100vh;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND DECORATION ===== */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(26, 35, 126, 0.03) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(13, 71, 161, 0.03) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
      animation: bgFloat 20s ease-in-out infinite;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(2%, 1%) rotate(2deg); }
    }

    /* ===== FLOATING PARTICLES ===== */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(26, 35, 126, 0.06);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== MAIN CONTAINER ===== */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 30px 80px rgba(26, 35, 126, 0.08),
        0 10px 40px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      position: relative;
      z-index: 1;
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .header .icon-wrapper {
      display: inline-block;
      background: linear-gradient(135deg, rgba(26, 35, 126, 0.06), rgba(13, 71, 161, 0.06));
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      margin-bottom: 0.3rem;
      border: 1px solid rgba(26, 35, 126, 0.04);
    }

    .header .icon {
      font-size: 3rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1a237e, #0d47a1, #1565c0, #1a237e);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 4s ease-in-out infinite;
      letter-spacing: -0.5px;
      margin-top: 0.2rem;
    }

    @keyframes shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .header .sub {
      color: #455a64;
      font-size: 1.05rem;
      font-weight: 500;
      margin-top: 0.2rem;
      letter-spacing: 2px;
    }

    .header .sub span {
      display: inline-block;
      animation: pulseText 2s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header .divider {
      width: 100px;
      height: 4px;
      margin: 0.8rem auto 0;
      background: linear-gradient(90deg, transparent, #1a237e, #0d47a1, transparent);
      border-radius: 10px;
    }

    .header .badge-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .header .badge-row .badge {
      background: rgba(26, 35, 126, 0.04);
      color: #1a237e;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      border: 1px solid rgba(26, 35, 126, 0.04);
      transition: 0.3s ease;
    }

    .header .badge-row .badge:hover {
      background: rgba(26, 35, 126, 0.08);
      transform: translateY(-2px);
    }

    /* ===== LEVEL TABS ===== */
    .level-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      justify-content: center;
    }

    .level-tab {
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      border: 2px solid rgba(26, 35, 126, 0.08);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      color: #455a64;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .level-tab:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: #1a237e;
      color: #1a237e;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 30px rgba(26, 35, 126, 0.08);
    }

    .level-tab.active {
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      border-color: #1a237e;
      color: #ffffff;
      box-shadow: 0 8px 30px rgba(26, 35, 126, 0.15);
      transform: translateY(-2px);
    }

    .level-tab .badge {
      display: inline-block;
      font-size: 0.55rem;
      background: rgba(255, 255, 255, 0.12);
      padding: 0.05rem 0.5rem;
      border-radius: 20px;
      color: inherit;
      margin-left: 4px;
    }

    .level-tab.active .badge {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* ===== LAYOUT: 2 KOLOM ===== */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .two-col {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    /* ===== SISI KIRI: RUMUS ===== */
    .formula-section {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 1.8rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-height: 650px;
      overflow-y: auto;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .formula-section::-webkit-scrollbar {
      width: 6px;
    }

    .formula-section::-webkit-scrollbar-track {
      background: rgba(26, 35, 126, 0.03);
      border-radius: 10px;
    }

    .formula-section::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #1a237e, #0d47a1);
      border-radius: 10px;
    }

    .formula-section .section-title {
      color: #1a237e;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 1.2rem;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      padding: 0.6rem 0;
      z-index: 10;
      border-bottom: 2px solid rgba(26, 35, 126, 0.06);
    }

    .formula-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 0.9rem 1.2rem;
      margin-bottom: 0.8rem;
      border-left: 4px solid #1a237e;
      transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .formula-card:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateX(8px) scale(1.01);
      border-color: #1a237e;
      box-shadow: 0 8px 30px rgba(26, 35, 126, 0.06);
    }

    .formula-card:active {
      transform: scale(0.98);
    }

    .formula-card .formula-name {
      color: #1a237e;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .formula-card .formula-name .emoji {
      font-size: 1.2rem;
    }

    .formula-card .formula-math {
      color: #0d47a1;
      font-size: 1.05rem;
      font-family: 'Courier New', monospace;
      margin-top: 0.2rem;
      padding: 0.3rem 0.8rem;
      background: rgba(13, 71, 161, 0.04);
      border-radius: 8px;
      display: inline-block;
      font-weight: 600;
      border: 1px solid rgba(13, 71, 161, 0.04);
    }

    .formula-card .formula-desc {
      color: #546e7a;
      font-size: 0.8rem;
      margin-top: 0.3rem;
      font-weight: 400;
    }

    .formula-card .formula-level {
      display: inline-block;
      font-size: 0.5rem;
      font-weight: 700;
      background: rgba(26, 35, 126, 0.04);
      color: #1a237e;
      padding: 0.05rem 0.6rem;
      border-radius: 20px;
      margin-top: 0.2rem;
      letter-spacing: 1px;
    }

    /* ===== SISI KANAN: KALKULATOR ===== */
    .calc-section {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 1.8rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .calc-section .section-title {
      color: #1a237e;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 1.2rem;
    }

    .input-area {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .input-area input {
      flex: 1;
      min-width: 160px;
      padding: 1rem 1.2rem;
      border-radius: 16px;
      border: 2px solid rgba(26, 35, 126, 0.06);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      color: #1a237e;
      font-size: 1.05rem;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .input-area input::placeholder {
      color: #90a4ae;
    }

    .input-area input:focus {
      border-color: #1a237e;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 0 6px rgba(26, 35, 126, 0.04), inset 0 2px 8px rgba(0, 0, 0, 0.02);
      transform: scale(1.01);
    }

    .btn-solve {
      padding: 1rem 2.4rem;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(26, 35, 126, 0.15);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
    }

    .btn-solve:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 40px rgba(26, 35, 126, 0.2);
    }

    .btn-solve:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(26, 35, 126, 0.1);
    }

    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .quick-btn {
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 2px solid rgba(26, 35, 126, 0.04);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      color: #455a64;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .quick-btn:hover {
      background: rgba(255, 255, 255, 0.6);
      border-color: #1a237e;
      color: #1a237e;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 4px 16px rgba(26, 35, 126, 0.06);
    }

    .quick-btn:active {
      transform: scale(0.95);
    }

    /* ===== HASIL ===== */
    .result-area {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.2rem;
      min-height: 100px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .result-area:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .result-area .result-main {
      font-size: 2rem;
      font-weight: 800;
      color: #1a237e;
      word-break: break-all;
      padding: 0.5rem 1rem;
      background: rgba(26, 35, 126, 0.03);
      border-radius: 12px;
      border-left: 4px solid #1a237e;
      margin-bottom: 0.5rem;
      transition: all 0.3s ease;
    }

    .result-steps {
      color: #37474f;
      font-size: 0.9rem;
      line-height: 2.2;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .result-steps .step {
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(26, 35, 126, 0.03);
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      animation: slideStep 0.3s ease forwards;
    }

    @keyframes slideStep {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .result-steps .step .step-num {
      color: #90a4ae;
      font-weight: 700;
      min-width: 28px;
      font-size: 0.8rem;
    }

    .result-steps .step .highlight {
      color: #0d47a1;
      font-weight: 700;
    }

    .result-steps .step .answer-highlight {
      color: #1a237e;
      font-weight: 800;
      background: rgba(26, 35, 126, 0.04);
      padding: 0.1rem 0.6rem;
      border-radius: 6px;
    }

    /* ===== STATUS ===== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 2px solid rgba(26, 35, 126, 0.04);
      color: #78909c;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #43a047;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .status-bar .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 640px) {
      .main-container {
        padding: 1.2rem 0.8rem;
        border-radius: 28px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .input-area {
        flex-direction: column;
      }

      .input-area input,
      .btn-solve {
        width: 100%;
      }

      .result-area .result-main {
        font-size: 1.5rem;
        padding: 0.4rem 0.8rem;
      }

      .formula-card .formula-math {
        font-size: 0.9rem;
      }

      .level-tab {
        font-size: 0.75rem;
        padding: 0.4rem 1rem;
      }

      .formula-section {
        max-height: 400px;
        padding: 1.2rem 1rem;
      }

      .calc-section {
        padding: 1.2rem 1rem;
      }

      .header .badge-row .badge {
        font-size: 0.6rem;
        padding: 0.2rem 0.7rem;
      }

      .status-bar {
        font-size: 0.6rem;
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 380px) {
      .main-container {
        padding: 0.8rem 0.5rem;
        border-radius: 20px;
      }

      .formula-card {
        padding: 0.6rem 0.8rem;
      }

      .header h1 {
        font-size: 1.4rem;
      }

      .result-area .result-main {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== PARTICLES BACKGROUND ===== -->
  <div class="particles" id="particles"></div>

  <div class="main-container">
    <!-- ===== HEADER ===== -->
    <div class="header">
      <div class="icon-wrapper">
        <span class="icon">📚</span>
      </div>
      <h1>Math Hub Premium</h1>
      <div class="sub">✨ Rumus Lengkap SD — SMP — SMA — S1 — S2 — S3 ✨</div>
      <div class="divider"></div>
      <div class="badge-row">
        <span class="badge">🎒 SD</span>
        <span class="badge">📘 SMP</span>
        <span class="badge">📗 SMA</span>
        <span class="badge">🎓 S1</span>
        <span class="badge">🔬 S2</span>
        <span class="badge">🏛️ S3</span>
        <span class="badge" style="background:rgba(26,35,126,0.08);">📊 56+ Rumus</span>
      </div>
    </div>

    <!-- ===== LEVEL TABS ===== -->
    <div class="level-tabs" id="levelTabs">
      <button class="level-tab active" data-level="sd" onclick="filterLevel('sd', this)">🎒 SD <span class="badge">1-6</span></button>
      <button class="level-tab" data-level="smp" onclick="filterLevel('smp', this)">📘 SMP <span class="badge">7-9</span></button>
      <button class="level-tab" data-level="sma" onclick="filterLevel('sma', this)">📗 SMA <span class="badge">10-12</span></button>
      <button class="level-tab" data-level="s1" onclick="filterLevel('s1', this)">🎓 S1 <span class="badge">Univ</span></button>
      <button class="level-tab" data-level="s2" onclick="filterLevel('s2', this)">🔬 S2 <span class="badge">Magister</span></button>
      <button class="level-tab" data-level="s3" onclick="filterLevel('s3', this)">🏛️ S3 <span class="badge">Doktoral</span></button>
      <button class="level-tab" data-level="all" onclick="filterLevel('all', this)">📚 Semua</button>
    </div>

    <!-- ===== LAYOUT 2 KOLOM ===== -->
    <div class="two-col">

      <!-- ===== SISI KIRI: DAFTAR RUMUS ===== -->
      <div class="formula-section">
        <div class="section-title" id="formulaTitle">📐 Rumus SD</div>
        <div id="formulaList"></div>
      </div>

      <!-- ===== SISI KANAN: KALKULATOR ===== -->
      <div class="calc-section">
        <div class="section-title">🧮 Kalkulator Cerdas</div>

        <div class="input-area">
          <input type="text" id="mathInput" placeholder="Contoh: 25 + 37, x^2 - 5x + 6 = 0" />
          <button class="btn-solve" onclick="solveMath()">
            <span>⚡</span> Hitung
          </button>
        </div>

        <div class="quick-buttons" id="quickButtons">
          <button class="quick-btn" onclick="quickSolve('25 + 37')">25 + 37</button>
          <button class="quick-btn" onclick="quickSolve('50 - 23')">50 - 23</button>
          <button class="quick-btn" onclick="quickSolve('7 * 8')">7 × 8</button>
          <button class="quick-btn" onclick="quickSolve('144 / 12')">144 ÷ 12</button>
          <button class="quick-btn" onclick="quickSolve('sqrt(81)')">√81</button>
          <button class="quick-btn" onclick="quickSolve('2^10')">2¹⁰</button>
          <button class="quick-btn" onclick="quickSolve('x^2 - 5x + 6 = 0')">x²-5x+6=0</button>
          <button class="quick-btn" onclick="quickSolve('sin(30)')">sin(30)</button>
          <button class="quick-btn" onclick="quickSolve('20% of 150')">20% of 150</button>
        </div>

        <div class="result-area" id="resultArea">
          <div class="result-main" id="resultMain">✨</div>
          <div class="result-steps" id="resultSteps">
            <div class="step" style="color:#90a4ae; border-bottom: none;">
              Masukkan soal atau pilih rumus di sebelah kiri 👈
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ===== STATUS ===== -->
    <div class="status-bar">
      <div class="status-item">
        <span class="status-dot"></span> Siap membantu
      </div>
      <div class="status-item" id="statusInfo">📚 SD - Kelas 1-6</div>
      <div class="status-item">📊 56+ Rumus Lengkap</div>
      <div class="status-item">✨ Premium Edition</div>
    </div>
  </div>

  <script>
    // =============================================
    // 1. PARTICLES BACKGROUND
    // =============================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';

    // =============================================
    // 6. SOLVE MATH
    // =============================================
    function solveMath() {
      const input = document.getElementById('mathInput');
      const resultMain = document.getElementById('resultMain');
      const resultSteps = document.getElementById('resultSteps');

      let expression = input.value.trim();
      if (!expression) {
        resultMain.textContent = '⚠️';
        resultMain.style.color = '#d32f2f';
        resultSteps.innerHTML = '<div class="step">Masukkan soal dulu ya! 😊</div>';
        return;
      }

      try {
        const solution = solveAll(expression);

        resultMain.textContent = solution.answer;
        resultMain.style.color = '#1a237e';

        resultSteps.innerHTML = solution.steps.map((s, i) => `
          <div class="step">
            <span class="step-num">${i + 1}.</span>
            <span>${s}</span>
          </div>
        `).join('');

      } catch (error) {
        resultMain.textContent = '❌';
        resultMain.style.color = '#d32f2f';
        resultSteps.innerHTML = `<div class="step">${error.message}</div>`;
      }
    }

    // =============================================
    // 7. SOLVE SEMUA JENIS
    // =============================================
    function solveAll(expr) {
      expr = expr.trim().toLowerCase();

      // ---- TRIGONOMETRI ----
      const trigMatch = expr.match(/(sin|cos|tan)\(?\s*(\d+)\s*\)?/i);
      if (trigMatch) {
        const func = trigMatch[1];
        const angle = parseFloat(trigMatch[2]);
        const rad = angle * Math.PI / 180;
        let result;
        switch (func) {
          case 'sin': result = Math.sin(rad); break;
          case 'cos': result = Math.cos(rad); break;
          case 'tan': result = Math.tan(rad); break;
          default: throw new Error('Fungsi tidak dikenal');
        }
        result = Math.round(result * 10000) / 10000;
        return {
          answer: `${result}`,
          steps: [
            `📌 ${func}(${angle}°) = ?`,
            `📝 Konversi ke radian: ${angle}° = ${rad.toFixed(4)} rad`,
            `📝 ${func}(${rad.toFixed(4)}) = ${result}`,
            `✅ <span class="answer-highlight">Jawaban: ${result}</span>`
          ]
        };
      }

      // ---- LOGARITMA ----
      const logMatch = expr.match(/log(?:10)?\s*\(?\s*(\d+)\s*\)?/i);
      if (logMatch) {
        const num = parseFloat(logMatch[1]);
        const result = Math.log10(num);
        return {
          answer: `${result.toFixed(4)}`,
          steps: [
            `📌 log₁₀(${num}) = ?`,
            `📝 Mencari pangkat 10 yang menghasilkan ${num}`,
            `📝 log₁₀(${num}) = ${result.toFixed(4)}`,
            `✅ <span class="answer-highlight">Jawaban: ${result.toFixed(4)}</span>`
          ]
        };
      }

      // ---- AKAR ----
      const sqrtMatch = expr.match(/(?:sqrt|√)\s*\(?\s*(\d+)\s*\)?/i);
      if (sqrtMatch) {
        const num = parseFloat(sqrtMatch[1]);
        const result = Math.sqrt(num);
        return {
          answer: `${result}`,
          steps: [
            `📌 √${num} = ?`,
            `📝 Mencari bilangan yang jika dikuadratkan = ${num}`,
            `📝 √${num} = ${result}`,
            `✅ <span class="answer-highlight">Jawaban: ${result}</span>`
          ]
        };
      }

      // ---- PANGKAT ----
      const powMatch = expr.match(/(\d+)\s*(?:\^|pangkat)\s*(\d+)/i);
      if (powMatch) {
        const b = parseFloat(powMatch[1]);
        const e = parseFloat(powMatch[2]);
        const result = Math.pow(b, e);
        return {
          answer: `${result}`,
          steps: [
            `📌 ${b}^${e} = ?`,
            `📝 ${b} × ${b} (${e} kali) = ${result}`,
            `✅ <span class="answer-highlight">Jawaban: ${result}</span>`
          ]
        };
      }

      // ---- PERSENTASE ----
      const percentMatch = expr.match(/(\d+)%\s*(?:of|dari)\s*(\d+)/i);
      if (percentMatch) {
        const p = parseFloat(percentMatch[1]);
        const n = parseFloat(percentMatch[2]);
        const result = (p / 100) * n;
        return {
          answer: `${result}`,
          steps: [
            `📌 ${p}% dari ${n} = ?`,
            `📝 ${p}% = ${p/100}`,
            `📝 ${p/100} × ${n} = ${result}`,
            `✅ <span class="answer-highlight">Jawaban: ${result}</span>`
          ]
        };
      }

      // ---- MEAN ----
      const meanMatch = expr.match(/mean\s*\(?\s*([\d,\s]+)\s*\)?/i);
      if (meanMatch) {
        const nums = meanMatch[1].split(',').map(n => parseFloat(n.trim()));
        const sum = nums.reduce((a, b) => a + b, 0);
        const mean = sum / nums.length;
        return {
          answer: `${mean}`,
          steps: [
            `📌 Data: ${nums.join(', ')}`,
            `📝 Jumlah = ${sum}, Banyak = ${nums.length}`,
            `📝 Mean = ${sum} / ${nums.length} = ${mean}`,
            `✅ <span class="answer-highlight">Jawaban: ${mean}</span>`
          ]
        };
      }

      // ---- ALJABAR: KUADRAT ----
      const quadMatch = expr.match(/^([+-]?\d*\.?\d*)?x\^2\s*([+-]\s*\d*\.?\d*)?x?\s*([+-]\s*\d*\.?\d*)?\s*=\s*0$/i);
      if (quadMatch) {
        const a = parseFloat(quadMatch[1] || '1');
        const b = parseFloat(quadMatch[2] || '0');
        const c = parseFloat(quadMatch[3] || '0');
        const D = b * b - 4 * a * c;
        let answer, steps = [];
        steps.push(`📌 ${a}x² + ${b}x + ${c} = 0`);
        steps.push(`📝 a = ${a}, b = ${b}, c = ${c}`);
        steps.push(`📝 D = b² - 4ac = ${D}`);

        if (D > 0) {
          const x1 = (-b + Math.sqrt(D)) / (2 * a);
          const x2 = (-b - Math.sqrt(D)) / (2 * a);
          answer = `x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(2)}`;
          steps.push(`📝 D > 0 → 2 akar real`);
          steps.push(`✅ <span class="answer-highlight">Jawaban: x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(2)}</span>`);
        } else if (D === 0) {
          const x = -b / (2 * a);
          answer = `x = ${x.toFixed(2)}`;
          steps.push(`📝 D = 0 → 1 akar real`);
          steps.push(`✅ <span class="answer-highlight">Jawaban: x = ${x.toFixed(2)}</span>`);
        } else {
          const real = (-b / (2 * a)).toFixed(2);
          const imag = (Math.sqrt(-D) / (2 * a)).toFixed(2);
          answer = `x₁ = ${real} + ${imag}i, x₂ = ${real} - ${imag}i`;
          steps.push(`📝 D < 0 → 2 akar imajiner`);
          steps.push(`✅ <span class="answer-highlight">Jawaban: ${answer}</span>`);
        }
        return { answer, steps };
      }

      // ---- LINEAR ----
      const linMatch = expr.match(/^([+-]?\d*\.?\d*)?x\s*([+-]\s*\d*\.?\d*)?\s*=\s*([+-]?\d*\.?\d*)$/i);
      if (linMatch) {
        const a = parseFloat(linMatch[1] || '1');
        const b = parseFloat(linMatch[2] || '0');
        const c = parseFloat(linMatch[3] || '0');
        const x = (c - b) / a;
        return {
          answer: `x = ${x}`,
          steps: [
            `📌 ${a}x + ${b} = ${c}`,
            `📝 ${a}x = ${c} - ${b} = ${c - b}`,
            `📝 x = ${c - b} / ${a} = ${x}`,
            `✅ <span class="answer-highlight">Jawaban: x = ${x}</span>`
          ]
        };
      }

      // ---- TURUNAN ----
      if (expr.includes('*x') && !expr.includes('=')) {
        const match = expr.match(/(\d+)\s*\*\s*x/i);
        if (match) {
          const a = parseFloat(match[1]);
          return {
            answer: `${a}`,
            steps: [
              `📌 Turunan dari ${a}x adalah ${a}`,
              `📝 d/dx (${a}x) = ${a}`,
              `✅ <span class="answer-highlight">Jawaban: ${a}</span>`
            ]
          };
        }
      }

      // ---- ARITMATIKA BIASA ----
      try {
        const clean = expr.replace(/π/g, Math.PI).replace(/e/g, Math.E);
        const result = new Function(`return (${clean})`)();
        return {
          answer: `${result}`,
          steps: [
            `📌 ${expr}`,
            `📝 = ${result}`,
            `✅ <span class="answer-highlight">Jawaban: ${result}</span>`
          ]
        };
      } catch (e) {
        throw new Error('Format tidak dikenali. Coba: x^2 - 5x + 6 = 0, sin(30), sqrt(81), 20% of 150');
      }
    }

    // =============================================
    // 8. QUICK SOLVE
    // =============================================
    function quickSolve(value) {
      document.getElementById('mathInput').value = value;
      solveMath();
    }

    // =============================================
    // 9. ENTER KEY
    // =============================================
    document.getElementById('mathInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        solveMath();
      }
    });

    // =============================================
    // 10. INISIALISASI
    // =============================================
    renderFormulas('sd');
    updateQuickButtons('sd');

  </script>
